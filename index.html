<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Primary SEO ===== -->
    <title>SalesBoard｜営業フリーランス専門のマッチングサービス</title>

    <link rel="canonical" href="https://salesboard.jcon.co.jp/" />

    <!-- ===== robots ===== -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- ===== Open Graph (SNS / Google リッチ表示) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SalesBoard" />
    <meta property="og:title" content="SalesBoard｜営業フリーランス専門のマッチングサービス" />

    <meta property="og:image" content="https://salesboard.jcon.co.jp/assets/hero.jpg" />
    <meta property="og:locale" content="ja_JP" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SalesBoard｜営業フリーランス専門のマッチングサービス" />

    <meta name="twitter:image" content="https://salesboard.jcon.co.jp/assets/hero.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/hero.jpg" />

    <!-- ===== JSON-LD 構造化データ ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SalesBoard",
      "url": "https://salesboard.jcon.co.jp/",
      "description": "営業フリーランス専門のマッチングサービス。高単価・フルリモート・週2日〜副業OKの案件を厳選掲載。",
      "publisher": {
        "@type": "Organization",
        "name": "株式会社JCON",
        "url": "https://salesboard.jcon.co.jp/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://salesboard.jcon.co.jp/assets/hero.jpg"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://salesboard.jcon.co.jp/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "JobPosting",
      "title": "営業フリーランス案件（業務委託）",
      "description": "SalesBoardでは営業フリーランス向けの高単価・リモート・副業可能な業務委託案件を多数掲載しています。",
      "employmentType": "CONTRACTOR",
      "hiringOrganization": {
        "@type": "Organization",
        "name": "SalesBoard",
        "sameAs": "https://salesboard.jcon.co.jp/"
      },
      "jobLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "JP"
        }
      },
      "applicantLocationRequirements": {
        "@type": "Country",
        "name": "Japan"
      },
      "jobLocationType": "TELECOMMUTE"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof emailjs !== 'undefined') {
          emailjs.init("l-4JMsbbRt5ETL0Su");
        }
